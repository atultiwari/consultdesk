name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root-${{ github.run_id }}
          MARIADB_DATABASE: consultdesk_test
          MARIADB_USER: consultdesk
          MARIADB_PASSWORD: db-${{ github.run_id }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ['1025:1025', '8025:8025']
    env:
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      MAILPIT_API: http://127.0.0.1:8025
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_TEST_NAME: consultdesk_test
      DB_USER: consultdesk
      DB_PASSWORD: db-${{ github.run_id }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, intl, sodium, pdo_sqlite
          coverage: pcov
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('api/composer.lock') }}
      - run: composer install --no-interaction --no-progress
      - if: matrix.php == '8.1'
        run: composer cs
      - if: matrix.php == '8.1'
        run: composer stan
      - run: composer test:coverage
      - run: composer coverage:check

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [web]
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root-${{ github.run_id }}
          MARIADB_DATABASE: consultdesk_e2e
          MARIADB_USER: consultdesk
          MARIADB_PASSWORD: db-${{ github.run_id }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: consultdesk_e2e
      DB_USER: consultdesk
      DB_PASSWORD: db-${{ github.run_id }}
      APP_URL: http://localhost:5173
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      SMTP_ENCRYPTION: none
      MAIL_FROM: bookings@example.test
      ADMIN_PATH: desk-e2e-admin
      E2E_ADMIN_PATH: desk-e2e-admin
      E2E_PHP: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, intl, sodium
          coverage: none
      - name: Generate throwaway keys for this run
        run: |
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "CRON_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "TELEGRAM_WEBHOOK_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "TELEGRAM_BOT_TOKEN=100000000:$(openssl rand -hex 20)" >> "$GITHUB_ENV"
      - run: composer install --no-interaction --no-progress
        working-directory: api
      - name: Create schema and demo data
        working-directory: api
        run: php bin/migrate.php && php bin/seed-dev.php
      - name: Start the API
        # Several workers, so the same-slot race test really sends requests in parallel.
        env:
          PHP_CLI_SERVER_WORKERS: '4'
        run: |
          php -S 127.0.0.1:8080 -t api/public api/public/index.php > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && exit 0; sleep 1; done
          echo "API did not start"; cat "$RUNNER_TEMP/api.log"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
