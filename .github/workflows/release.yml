name: Release

# Tag a version (git tag v0.8.0 && git push origin v0.8.0) and this builds the upload-ready zip
# and attaches it to a GitHub release. See docs/DEPLOY-HOSTINGER.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds with read-only access: third-party install scripts never hold a token that can write.
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, intl, sodium, gd, exif
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n "s/.*CURRENT = '\([^']*\)'.*/\1/p" api/src/Version.php)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} but Version::CURRENT is $version"; exit 1; }
      - name: Build
        run: ./release/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consultdesk-zip
          path: build/consultdesk-*.zip

  # Signs the zip with RELEASE_SIGNING_KEY (Ed25519). Installations accept an update only with a
  # valid signature (see api/src/Updates/ReleaseKey.php). No third-party code runs in this job.
  sign:
    needs: zip
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: api/src/Updates/ReleaseKey.php
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: consultdesk-zip
      - name: Sign and check the signature against the key in the code
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          php -r 'exit(function_exists("sodium_crypto_sign_detached") ? 0 : 1);'
          for zip in consultdesk-*.zip; do
            php -r '
              $zip = $argv[1];
              $secret = base64_decode(getenv("RELEASE_SIGNING_KEY"), true);
              if ($secret === false || strlen($secret) !== SODIUM_CRYPTO_SIGN_SECRETKEYBYTES) { fwrite(STDERR, "RELEASE_SIGNING_KEY is missing or malformed\n"); exit(1); }
              $signature = sodium_crypto_sign_detached(file_get_contents($zip), $secret);
              preg_match("/PUBLIC_KEY = \x27([^\x27]+)\x27/", file_get_contents("api/src/Updates/ReleaseKey.php"), $m);
              if (!sodium_crypto_sign_verify_detached($signature, file_get_contents($zip), base64_decode($m[1]))) { fwrite(STDERR, "The signing key does not match ReleaseKey::PUBLIC_KEY\n"); exit(1); }
              file_put_contents($zip . ".sig", base64_encode($signature));
            ' "$zip"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consultdesk-signed
          path: consultdesk-*.zip*

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: consultdesk-signed
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" consultdesk-*.zip consultdesk-*.zip.sig --title "ConsultDesk $GITHUB_REF_NAME" --generate-notes
