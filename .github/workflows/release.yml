name: Release

# Tag a version (git tag v0.8.0 && git push origin v0.8.0) and this builds the upload-ready zip
# and attaches it to a GitHub release. See docs/DEPLOY-HOSTINGER.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds with read-only access: third-party install scripts never hold a token that can write.
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, intl, sodium, gd, exif
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n "s/.*CURRENT = '\([^']*\)'.*/\1/p" api/src/Version.php)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} but Version::CURRENT is $version"; exit 1; }
      - name: Build
        run: ./release/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consultdesk-zip
          path: build/consultdesk-*.zip

  publish:
    needs: zip
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: consultdesk-zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" consultdesk-*.zip --title "ConsultDesk $GITHUB_REF_NAME" --generate-notes
