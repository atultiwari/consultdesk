name: Release

# Tag a version (git tag v0.8.0 && git push origin v0.8.0) and this builds the upload-ready zip
# and attaches it to a GitHub release. See docs/DEPLOY-HOSTINGER.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, intl, sodium, gd, exif
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n "s/.*CURRENT = '\([^']*\)'.*/\1/p" api/src/Version.php)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} but Version::CURRENT is $version"; exit 1; }
      - name: Build
        run: ./release/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: consultdesk-zip
          path: build/consultdesk-*.zip
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/consultdesk-*.zip --title "ConsultDesk $GITHUB_REF_NAME" --generate-notes
