# LOCAL DEV ONLY. Production is shared hosting (PHP + MySQL) — see docs/PLAN.md §3.
services:
  api:
    build: ./docker/php
    ports:
      - "127.0.0.1:${API_PORT:-8080}:80"
    volumes:
      - ./api:/var/www/api
    environment:
      APP_DEBUG: "1"
      # Throwaway local-dev values. Real installs get these from config.php (Phase 8 installer).
      APP_URL: ${APP_URL:-http://localhost:5173}
      # No default on purpose: generate a local key into .env (see README), never commit one.
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env - see README "Local development"}
      CRON_KEY: ${CRON_KEY:-local-dev-cron-key-not-secret-0000}
      # The admin panel lives at http://localhost:5173/<ADMIN_PATH>. Pick your own in production.
      ADMIN_PATH: ${ADMIN_PATH:-desk-local-dev}
      MAIL_FROM: bookings@example.test
      MAIL_FROM_NAME: ConsultDesk (local)
      SMTP_ENCRYPTION: none
      # Optional integrations, read from .env when set (see docs/INSTALL.md).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Default Razorpay test keys; keys saved on the Payments page override them.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # The first owner on a fresh database (bin/install.php or the first visit to the admin path).
      # What booking codes start with until staff change it in the admin panel (e.g. VRL → VRL-7F3K).
      BOOKING_PREFIX: ${BOOKING_PREFIX:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_NAME: ${OWNER_NAME:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      SETUP_KEY: ${SETUP_KEY:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-consultdesk}
      DB_USER: ${DB_USER:-consultdesk}
      DB_PASSWORD: ${DB_PASSWORD:-dev-password-change-me}
      DB_TEST_NAME: consultdesk_test
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAILPIT_API: http://mailpit:8025
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.6
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev-root-change-me}
      MARIADB_DATABASE: ${DB_NAME:-consultdesk}
      MARIADB_USER: ${DB_USER:-consultdesk}
      MARIADB_PASSWORD: ${DB_PASSWORD:-dev-password-change-me}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  db-data:
