# LOCAL DEV ONLY. Production is shared hosting (PHP + MySQL) — see docs/PLAN.md §3.
services:
  api:
    build: ./docker/php
    ports:
      - "127.0.0.1:${API_PORT:-8080}:80"
    volumes:
      - ./api:/var/www/api
    environment:
      APP_DEBUG: "1"
      # Throwaway local-dev values. Real installs get these from config.php (Phase 8 installer).
      APP_URL: ${APP_URL:-http://localhost:5173}
      APP_KEY: ${APP_KEY:-base64:bG9jYWwtZGV2LW9ubHkta2V5LW5vdC1zZWNyZXQhISE=}
      CRON_KEY: ${CRON_KEY:-local-dev-cron-key-not-secret-0000}
      MAIL_FROM: bookings@example.test
      MAIL_FROM_NAME: ConsultDesk (local)
      SMTP_ENCRYPTION: none
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-consultdesk}
      DB_USER: ${DB_USER:-consultdesk}
      DB_PASSWORD: ${DB_PASSWORD:-dev-password-change-me}
      DB_TEST_NAME: consultdesk_test
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAILPIT_API: http://mailpit:8025
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.6
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev-root-change-me}
      MARIADB_DATABASE: ${DB_NAME:-consultdesk}
      MARIADB_USER: ${DB_USER:-consultdesk}
      MARIADB_PASSWORD: ${DB_PASSWORD:-dev-password-change-me}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  db-data:
